[project]
name = "pdf-extractor-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oleh Lokshyn", email = "olokshyn@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docling>=2.130.0",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.ruff]
extend-exclude = ["notebooks", "src/pdf_extractor_ai/old"]

[tool.ruff.lint]
extend-select = ["I", "ANN"]
ignore = ["ANN401"]  # Allow explicitly chosen Any as an escape hatch

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["*.py"]
asyncio_mode = "auto"
markers = [
    "integration: tests that call external services",
]

[tool.mypy]
strict = true
files = ["src/pdf_extractor_ai", "tests"]
mypy_path = "src"
explicit_package_bases = true
exclude = ["^notebooks/", "^src/pdf_extractor_ai/old/"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
